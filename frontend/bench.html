<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesura d'Argon2id</title>
    <style>
      body { font: 18px/1.5 system-ui, sans-serif; margin: 0 auto; padding: 16px; max-width: 40rem; background: #faf8f4; color: #2e3a36; }
      button { font: inherit; padding: 12px 20px; border-radius: 10px; border: 0; background: #2e3a36; color: white; }
      button:disabled { opacity: 0.5; }
      table { border-collapse: collapse; width: 100%; margin-top: 16px; }
      th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #ddd; font-variant-numeric: tabular-nums; }
      .ok { color: #2f6b3a; } .warn { color: #a05a00; } .err { color: #a3261f; }
      #device { color: #666; font-size: 14px; word-break: break-word; }
    </style>
  </head>
  <body>
    <h1>Mesura d'Argon2id</h1>
    <p>
      Mesura quant triga a derivar les claus a partir de la contrasenya en aquest dispositiu.
      Mantén la pantalla encesa i no canviïs d'aplicació mentre dura (uns 30 segons).
    </p>
    <button id="start">Comença</button>
    <table>
      <thead><tr><th>Paràmetres</th><th>Mediana</th><th>Màxim</th><th>Resultat</th></tr></thead>
      <tbody id="results"></tbody>
    </table>
    <p id="summary"></p>
    <p id="device"></p>
    <script type="module" src="/src/bench.ts"></script>
  </body>
</html>
